<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chân lý cuộc đời</title>

  <!-- Mobile responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white;
      padding: 20px;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 30px 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    #content {
      margin-top: 20px;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    #content img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    #text {
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 600;
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 14px 32px;
      border-radius: 999px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7a18, #ffb347);
      color: white;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(255, 150, 0, 0.4);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    footer {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>💬 Quà tặng cuộc sống</h1>

    <button onclick="showContent()">Xem quà nào 😏</button>

    <div id="content">
      <!-- Ảnh -->
      <img src="manh.jpg" alt="random image">

      <!-- Text -->
      <div id="text">
        Đẹp trai thì mới có nhiều đứa yêu 😎
      </div>
    </div>

    <footer>🤡🤡🤡🤡🤡🤡</footer>
  </div>

  <script>
    function showContent() {
      document.getElementById("content").style.display = "block";
    }
  </script>

</body>
</html>
