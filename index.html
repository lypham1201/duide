<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Daily Toxic Quote</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 20px;
      width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    #quote {
      margin: 30px 0;
      font-size: 18px;
      line-height: 1.6;
      min-height: 80px;
      opacity: 1;
      transition: all 0.4s ease;
    }

    .fade {
      opacity: 0;
      transform: translateY(10px);
    }

    .show {
      opacity: 1;
      transform: translateY(0);
    }

    button {
      padding: 12px 28px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7a18, #ffb347);
      color: white;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(255, 150, 0, 0.4);
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>💬 Toxic Wisdom</h1>

    <!-- Không hiện quote ban đầu -->
    <div id="quote">Bấm nút để nhận chân lý 😏</div>

  "Bạn không cần thay đổi… người khác cần bạn biến mất 😆"

    let lastIndex = -1;

    function showQuote() {
      let index;

      do {
        index = Math.floor(Math.random() * quotes.length);
      } while (index === lastIndex);

      lastIndex = index;

      const quoteEl = document.getElementById("quote");

      quoteEl.classList.add("fade");

      setTimeout(() => {
        quoteEl.innerText = quotes[index];
        quoteEl.classList.remove("fade");
        quoteEl.classList.add("show");
      }, 200);
    }
  </script>

</html>
